<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>【テスト版】売上アップ・ノート</title>
<meta name="theme-color" content="#c0392b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="売上ノートTEST">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* 片手で使う縦一列のノート。日向夏イエローの「次の一手」だけを主役にし、他は日向灘ブルーで静かにまとめる。ネットなしで動くよう、書体は端末内のものだけを使う */
:root{
  --paper:#edf1ee;--card:#ffffff;--ink:#172233;--sub:#5a6575;--line:#d6ddd9;
  --sea:#1d5b86;--sea-2:#2f77a8;--sea-soft:#a9c5d9;--sea-wash:#e3eef5;--on-sea:#ffffff;
  --sun:#f3c623;--sun-ink:#2c2300;--sun-wash:#fdf3c9;--sun-line:#d29a00;
  --ember:#c4432b;--ember-wash:#fde3dc;--leaf:#2c7a4b;--leaf-wash:#e2f1e7;
  --shadow:0 1px 0 rgba(23,34,51,.04),0 6px 20px -12px rgba(23,34,51,.25);--scrim:rgba(15,20,28,.45);
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  --r-xl:22px;--r-l:16px;--r-m:12px;--r-s:8px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0f141c;--card:#182030;--ink:#e8edf3;--sub:#99a5b5;--line:#2a3447;
  --sea:#6fb0de;--sea-2:#8cc3ea;--sea-soft:#355772;--sea-wash:#1b2b3d;--on-sea:#0f141c;
  --sun:#f3c623;--sun-ink:#2c2300;--sun-wash:#3a3313;--sun-line:#f3c623;
  --ember:#f07a62;--ember-wash:#3c201a;--leaf:#62cb8c;--leaf-wash:#183326;
  --shadow:0 0 0 1px rgba(255,255,255,.03);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.6;font-family:var(--font);font-size:15px;font-feature-settings:"palt";
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{text-wrap:balance}
table,.stat b,.kv b,.big{font-variant-numeric:tabular-nums}
a{color:var(--sea)}
:focus-visible{outline:3px solid var(--sea-2);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 14px}
.top .shop{font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.saved{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--leaf-wash);color:var(--leaf);font-weight:700;transition:background .3s}
.saved.pulse{background:var(--sun)}
.saved.demo{background:var(--sun);color:var(--sun-ink)}
.iconbtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--ink);border:1px solid var(--line);text-decoration:none;flex:none}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--sub);text-decoration:none;font-size:14px;padding-block:16px 4px}
.phead{padding-block:4px 6px}
.pn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sea);color:var(--on-sea);font-weight:800;font-size:15px;margin-right:8px;vertical-align:3px}
.phead h1{display:inline;font-size:23px;margin:0;font-weight:800;letter-spacing:-.01em}
.phead p{margin:8px 0 0;color:var(--sub);font-size:14px;max-width:36em}
.pbar{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:12px;color:var(--sub)}
.pbar .track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar .track i{display:block;height:100%;background:var(--leaf);border-radius:3px;transition:width .4s}
.banner .btn{white-space:nowrap;flex:none}
.onb-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.onb h3+.onb-row{border-top:0}
.onb-n{width:30px;height:30px;border-radius:50%;background:var(--sea-wash);color:var(--sea);display:grid;place-items:center;font-weight:800}
.onb-n svg{width:16px;height:16px}
.onb-row.done .onb-n{background:var(--leaf);color:var(--card)}
.onb-row b{display:block;font-size:15px;line-height:1.5}
.onb-row.done b{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sea-soft)}
.onb-d{display:block;font-size:13px;color:var(--sub);margin:2px 0 8px;line-height:1.6}
.onb-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;font-weight:700}
.linkbtn{background:none;border:0;color:var(--sea);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.reportrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:var(--r-m);padding:14px 16px;margin:0 0 14px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.reportrow b{display:block;font-size:15px}
.reportrow small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.faq details{border-top:1px solid var(--line);padding-block:12px}
.faq details:first-child{border-top:0;padding-top:0}
.faq summary{font-weight:700;cursor:pointer;font-size:15px}
.faq p{font-size:14px;margin:8px 0 0;line-height:1.75}
.banner.warn{background:var(--ember-wash);border-color:var(--ember)}
.banner.warn b{color:var(--ember)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sun-wash);border:1px solid var(--sun);border-radius:var(--r-m);padding:10px 12px;margin:0 0 14px;font-size:13px}

.hero{background:var(--sun);color:var(--sun-ink);border-radius:var(--r-xl);padding:20px 20px 18px;margin:4px 0 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-48px;top:-48px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.55),rgba(255,255,255,0) 65%);pointer-events:none}
.hero .k{font-size:13px;font-weight:700;opacity:.75}
.hero h2{margin:4px 0 6px;font-size:24px;line-height:1.35;font-weight:800;letter-spacing:-.01em;max-width:18em}
.hero p{margin:0 0 14px;font-size:14px;max-width:32em}
.hero .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero .from{font-size:12px;font-weight:700;opacity:.75}
.hero .go{background:var(--sun-ink);color:var(--sun);text-decoration:none;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px}
.hero.allset{background:var(--leaf-wash);color:var(--ink)}

.snap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:22px}
@media(min-width:600px){.snap{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border-radius:var(--r-m);padding:12px;box-shadow:var(--shadow);text-decoration:none;color:inherit;min-width:0}
.stat span{display:block;font-size:11px;color:var(--sub)}
.stat b{display:block;font-size:18px;line-height:1.3;margin-top:2px}
.stat em{font-style:normal;font-size:11px}
.up{color:var(--leaf)}.down{color:var(--ember)}.muted{color:var(--sub)}

.sec-h{font-size:16px;font-weight:800;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h small{font-weight:400;color:var(--sub);font-size:12px}
.plist{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 14px 14px 16px;color:inherit;text-decoration:none;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .n{font-size:23px;font-weight:800;color:var(--sea);text-align:center}
.prow .t{font-weight:700;font-size:15px;line-height:1.35}
.prow .s{font-size:12px;color:var(--sub);margin-top:2px}
.ring{--p:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--sub);background:conic-gradient(var(--leaf) calc(var(--p)*1%),var(--line) 0)}
.ring::before{content:attr(data-v);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--card)}
.queue{list-style:none;margin:0 0 22px;padding:0}
.queue li a{display:grid;grid-template-columns:1.4em minmax(0,1fr);gap:2px 10px;padding:10px 2px;border-bottom:1px dashed var(--line);color:inherit;text-decoration:none;font-size:14px}
.queue li .o{font-weight:800;color:var(--sea)}
.queue li .p{grid-column:2;font-size:11px;color:var(--sub)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 12px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:8px 14px;border-radius:999px;font-size:14px;text-decoration:none;color:var(--sub);background:var(--card);border:1px solid var(--line);font-weight:700}
.tabs a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.seg a{text-align:center;padding:9px 0;border-radius:999px;text-decoration:none;color:var(--sub);font-weight:700;font-size:14px}
.seg a.on{background:var(--sea);color:var(--on-sea)}

.panel{background:var(--card);border-radius:var(--r-l);padding:16px;margin:0 0 12px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 12px;font-size:16px;font-weight:800}
.panel h3 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.note{font-size:12px;color:var(--sub);line-height:1.7;margin:8px 0 0}
.callout{background:var(--sea-wash);border-radius:var(--r-m);padding:12px 14px;font-size:13px;margin:0 0 12px}

.group-h{font-size:15px;font-weight:800;margin:20px 0 2px}
.group-h:first-child{margin-top:0}
.group-d{font-size:12px;color:var(--sub);margin:0 0 6px}
.todo{display:grid;grid-template-columns:36px minmax(0,1fr);gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.group-d+.todo,.panel>.todo:first-child{border-top:0}
.check{width:28px;height:28px;margin-top:1px;border-radius:50%;border:2px solid var(--sea-soft);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:transparent;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px}
.todo.done .check{background:var(--leaf);border-color:var(--leaf);color:var(--card)}
.check:disabled{cursor:default}
.todo summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding-block:3px;font-size:15px;font-weight:700;line-height:1.45}
.todo summary::-webkit-details-marker{display:none}
.todo summary .tt{flex:1 1 200px}
.todo.done summary .tt{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sea-soft)}
.todo summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);margin:0 4px 4px;transition:transform .2s}
.todo details[open] summary::after{transform:rotate(-135deg);margin-bottom:-2px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.hot{background:var(--sun);color:var(--sun-ink)}
.tag.mid{background:var(--sea-wash);color:var(--sea)}
.tag.auto{background:var(--leaf-wash);color:var(--leaf)}
.tag.warn{background:var(--ember-wash);color:var(--ember)}
.todo .body{font-size:14px;padding-block:4px 6px}
.todo .body p{margin:6px 0}
.todo .body .lb{display:inline-block;font-size:11px;font-weight:700;color:var(--sea);margin-right:6px}
.todo .body .lnk{display:inline-block;margin-top:4px;font-size:13px;font-weight:700}
.todo.flash{animation:flash 1.6s ease}
@keyframes flash{0%,30%{background:var(--sun-wash)}100%{background:transparent}}

.field{margin-bottom:14px}
.field>label,.flabel{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.hint{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-wash)}
textarea{min-height:76px;resize:vertical;line-height:1.6}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chips label{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px;cursor:pointer;user-select:none;-webkit-user-select:none;font-weight:500;line-height:1.3}
.chips input:checked+label{background:var(--sea);border-color:var(--sea);color:var(--on-sea);font-weight:700}
.chips input:focus-visible+label{outline:3px solid var(--sea-2);outline-offset:2px}
.qblock{padding-block:12px;border-top:1px solid var(--line)}
.qblock:first-of-type{border-top:0;padding-top:0}
.qblock .flabel{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.qblock .flabel em{font-style:normal;font-weight:400;font-size:12px;color:var(--sub);text-align:right}
.subhead{font-size:13px;font-weight:800;color:var(--sea);margin:18px 0 0}
.btn{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:999px;padding:13px 20px;cursor:pointer;background:var(--sea);color:var(--on-sea);text-decoration:none;display:inline-block;text-align:center}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--ember);border:1px solid var(--ember)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.small{padding:8px 14px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1 1 auto}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-block:10px 4px;background:linear-gradient(to bottom,transparent,var(--card) 30%);margin-inline:-16px;padding-inline:16px;z-index:4;display:flex;gap:8px;align-items:center}
.savebar .st-line{flex:1;font-size:12px;color:var(--sub)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kv{background:var(--paper);border-radius:var(--r-m);padding:12px;min-width:0}
.kv span{display:block;font-size:11px;color:var(--sub)}
.kv b{display:block;font-size:19px;margin-top:2px;line-height:1.3}
.kv em{display:block;font-style:normal;font-size:11px;margin-top:2px}
.meter{height:10px;background:var(--paper);border-radius:5px;overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--sea);border-radius:5px}
.big{font-size:27px;font-weight:800;line-height:1.2}

.dist{display:grid;gap:8px}
.dist .r{display:grid;grid-template-columns:minmax(5em,8.5em) minmax(0,1fr) 3.6em;gap:8px;align-items:center;font-size:13px}
.dist .bar{height:20px;background:var(--paper);border-radius:4px;overflow:hidden}
.dist .bar i{display:block;height:100%;background:var(--sea-soft);border-radius:4px}
.dist .r.top .bar i{background:var(--sea)}
.dist .v{text-align:right;color:var(--sub)}
.insights{margin:0;padding:0;list-style:none}
.insights li{position:relative;padding:8px 0 8px 18px;font-size:14px;border-top:1px solid var(--line)}
.insights li:first-child{border-top:0}
.insights li::before{content:"";position:absolute;left:2px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--sun-line)}
.persona{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;margin-bottom:10px}
.persona .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.persona .h b{font-size:15px}
.persona dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:13px}
.persona dt{color:var(--sub)}
.persona dd{margin:0}

/* お客様台帳 */
.search{position:relative;margin-bottom:10px}
.search input{padding-left:40px;background:var(--card)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--sub)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters a{flex:none;padding:6px 12px;border-radius:999px;font-size:13px;text-decoration:none;color:var(--sub);border:1px solid var(--line);background:var(--card);font-weight:700}
.filters a.on{background:var(--sea);color:var(--on-sea);border-color:var(--sea)}
.clist{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.crow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.crow:first-child{border-top:0}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:var(--on-sea);background:var(--sea);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:76px;height:76px;font-size:26px}
.crow .nm{font-weight:800;font-size:15px;line-height:1.3}
.crow .nm small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.crow .sb{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .ft{font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .rt{text-align:right;font-size:11px;color:var(--sub);white-space:nowrap}
.crow .rt b{display:block;font-size:13px;color:var(--ink)}
.chead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin:4px 0 14px}
.chead h1{margin:0;font-size:24px;font-weight:800;line-height:1.3}
.chead .sb{font-size:13px;color:var(--sub)}
.photo{width:100%;border-radius:var(--r-m);display:block;margin-bottom:10px;max-height:320px;object-fit:contain;background:var(--paper)}
.vlist{display:flex;flex-wrap:wrap;gap:6px}
.vlist span{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px}
.vlist button{border:0;background:var(--line);color:var(--ink);width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;padding:0}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;color:var(--sub);font-weight:700}
th:first-child,td:first-child{text-align:left}
td.memo{text-align:left;white-space:normal;color:var(--sub);min-width:120px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sea-wash)}
.tw{overflow-x:auto;margin-inline:-4px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--sub);font-size:11px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

<script>
(function(){
'use strict';
/* ============ 保存（この端末の中だけ） ============ */
const LKEY='stg_growth-note-v2',PREF='stg_growth-note-pref-v2';
const WD=['日','月','火','水','木','金','土'];
const defSettings=()=>({name:'',seats:null,bizDays:26,target:null,ticket:null,advisor:'周平さん'});
const SCHEMA=3;
const blank=()=>({schema:SCHEMA,settings:defSettings(),days:{},months:{},talks:[],exps:[],custs:[],todo:{},value:{answers:{},cands:[],adopted:null}});
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){localStorage.setItem(k,JSON.stringify(v));}};
let S=blank(),mode='local',REAL=null,storageOK=true;
const pref=Object.assign({entryTab:'talk',lastBackup:0,lastReport:0,reportNote:'',onboardDone:false,onbHome:false},store.get(PREF,{}));
const savePref=()=>{try{store.set(PREF,pref);}catch(e){}};
/* 版ごとの移行。古い版のデータを読んだら、新しい形に順番に直す（項目は足すだけで消さない） */
const MIGRATE={
  3:D=>D /* v2→v3：形は同じ。版番号だけ付ける */
};
function migrate(D){let v=+D.schema||2;while(v<SCHEMA){v++;if(MIGRATE[v])D=MIGRATE[v](D)||D;}D.schema=SCHEMA;return D;}
function load(){const L=store.get(LKEY,null);if(L){const old=+L.schema||2;
    if(old<SCHEMA){try{const raw=localStorage.getItem(LKEY);if(raw&&raw.length<1.5e6)localStorage.setItem(LKEY+'-before-v'+SCHEMA,raw);}catch(e){}}
    S=migrate(Object.assign(blank(),L));['talks','exps','custs'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];});S.settings=Object.assign(defSettings(),S.settings);
    if(old<SCHEMA)saveAll();}}
function saveAll(){if(mode==='demo')return;try{store.set(LKEY,S);storageOK=true;markSaved();}
  catch(e){storageOK=false;toast('端末の保存領域がいっぱいです。バックアップを保存して、名刺写真を整理してください');}}
function markSaved(){const el=document.getElementById('saved');if(!el)return;const d=new Date();el.textContent=`自動保存 ${pad(d.getHours())}:${pad(d.getMinutes())}`;el.classList.add('pulse');setTimeout(()=>el.classList.remove('pulse'),500);}
const putDay=(d,o)=>{S.days[d]=o;saveAll();};
const delDay=d=>{delete S.days[d];saveAll();};
const upsert=(arr,x)=>{const i=S[arr].findIndex(e=>e.id===x.id);if(i>=0)S[arr][i]=x;else S[arr].push(x);saveAll();};
const remove=(arr,id)=>{S[arr]=S[arr].filter(e=>e.id!==id);saveAll();};
const putMonth=(m,o)=>{S.months[m]=o;saveAll();};

/* 名刺写真は端末内のデータベースに保存 */
const idb={_p:null,open(){if(!this._p)this._p=new Promise(res=>{try{if(!window.indexedDB)return res(null);const r=indexedDB.open('stg_growth-note',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});return this._p;},
  async tx(mode,fn){const d=await this.open();if(!d)return null;return new Promise(res=>{try{const t=d.transaction('photos',mode),st=t.objectStore('photos'),rq=fn(st);
    t.oncomplete=()=>res(rq&&rq.result!==undefined?rq.result:true);t.onerror=()=>res(null);}catch(e){res(null);}});},
  get(k){return this.tx('readonly',s=>s.get(k));},put(k,v){return this.tx('readwrite',s=>s.put(v,k));},del(k){return this.tx('readwrite',s=>s.delete(k));},
  async all(){const keys=await this.tx('readonly',s=>s.getAllKeys())||[];const out={};for(const k of keys)out[k]=await this.get(k);return out;}};
function compressImage(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.72));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('画像を読み込めませんでした'));};img.src=url;});}

/* ============ ユーティリティ ============ */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const today=()=>iso(new Date());
const daysAgo=s=>s?Math.round((toDate(today())-toDate(s))/864e5):null;
const agoLabel=s=>{const n=daysAgo(s);return n==null?'―':n===0?'今日':n===1?'昨日':n<60?`${n}日前`:`${Math.round(n/30)}か月前`;};
const prevYm=m=>{const[y,mo]=m.split('-').map(Number);return ymOf(new Date(y,mo-2,1));};
const ymLabel=m=>{const[y,mo]=m.split('-');return `${y}年${+mo}月`;};
const yen=v=>v==null||!isFinite(v)?'―':'¥'+Math.round(v).toLocaleString('ja-JP');
const man=v=>v==null||!isFinite(v)?'―':(Math.abs(v)>=10000?(v/10000).toFixed(Math.abs(v)>=1e6?0:1).replace(/\.0$/,'')+'万円':Math.round(v).toLocaleString('ja-JP')+'円');
const num=(v,dg=0)=>v==null||!isFinite(v)?'―':Number(v).toLocaleString('ja-JP',{maximumFractionDigits:dg,minimumFractionDigits:dg});
const pct=(v,dg=0)=>v==null||!isFinite(v)?'―':(v*100).toFixed(dg)+'%';
const signPct=r=>(r>=0?'+':'')+(r*100).toFixed(1)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nn=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(/[,¥円\s]/g,''));return isNaN(n)?null:n;};
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}
function delta(cur,prev,label='前月比'){if(cur==null||!prev)return'<em class="muted">前月データなし</em>';const r=cur/prev-1;return`<em class="${r>=0?'up':'down'}">${label} ${signPct(r)}</em>`;}
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function ask(msg,okLabel,danger){return new Promise(res=>{const root=$('#modal-root');
  root.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box"><p>${msg}</p><div class="btns"><button class="btn ghost" data-m="0">やめる</button><button class="btn ${danger?'danger':''}" data-m="1">${okLabel}</button></div></div></div>`;
  const close=v=>{root.innerHTML='';res(v);};
  root.querySelector('.modal').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)close(b.dataset.m==='1');else if(e.target.classList.contains('modal'))close(false);});
  root.querySelector('[data-m="1"]').focus();});}
const entries=()=>Object.keys(S.days).sort().map(d=>Object.assign({date:d},S.days[d]));
const monthEntries=m=>entries().filter(e=>e.date.startsWith(m));
function stats(es){const days=es.length,sales=sum(es,e=>e.sales),guests=sum(es,e=>e.guests);const wn=es.filter(e=>e.newGuests!=null&&e.guests);
  return{days,sales,guests,avgSales:days?sales/days:null,avgGuests:days?guests/days:null,ticket:guests?sales/guests:null,newRate:wn.length?sum(wn,e=>e.newGuests)/sum(wn,e=>e.guests):null};}

/* ============ 会話メモ・お客様の項目 ============ */
const Q={
  seg:{l:'宮崎とのご縁',ask:'「宮崎とはご縁があるんですか？」',multi:false,opts:['宮崎出身','宮崎にゆかり','宮崎好き・旅行','ゆかりなし']},
  from:{l:'宮崎のどちら',ask:'「宮崎のどちらですか？」',multi:false,opts:['宮崎市','都城','延岡','日南・串間','小林・えびの','日向・門川','西都・児湯','その他']},
  vis:{l:'来店は何回目',ask:'「前にも来てくださいましたっけ？」',multi:false,opts:['初めて','2〜4回目','5回以上']},
  ch:{l:'知ったきっかけ',ask:'「何でうちを知ってくださったんですか？」',multi:false,opts:['Googleマップ','Instagram','グルメサイト','県人会・紹介','通りがかり','イベント','その他']},
  purpose:{l:'誰と・どんな集まり',ask:'「今日はお仕事帰りですか？」',multi:false,opts:['仕事帰り','接待・会食','友人と','家族と','デート','一人飲み','同郷の集まり']},
  age:{l:'年代',ask:'見た目の印象で大丈夫です',multi:false,opts:['20代','30代','40代','50代','60代以上']},
  n:{l:'人数',ask:'',multi:false,opts:['1人','2人','3人','4人','5人以上']},
  likes:{l:'喜んでいたもの',ask:'複数可',multi:true,opts:['地鶏炭火焼','チキン南蛮','冷汁','肉巻きおにぎり','宮崎牛','刺身','焼酎','その他']},
  topics:{l:'盛り上がった話題',ask:'複数可',multi:true,opts:['地元・母校','宮崎の近況','仕事','スポーツ','旅行','食べ物・お酒']},
  wants:{l:'要望・気になる点',ask:'複数可',multi:true,opts:['特になし','量','価格','提供の速さ','席・予約','新メニュー','もっと宮崎感']},
  sat:{l:'満足度',ask:'表情や言葉から',multi:false,opts:['とても満足','満足','いまひとつ']},
  ctag:{l:'お客様の種類',ask:'複数可',multi:true,opts:['常連','幹事をよくする','県人会','紹介してくれた','取引先・業者','要注意']},
};
const CORE=['seg','from','vis','ch'],MORE=['purpose','age','n','likes','topics','wants','sat'];

/* ============ 6つの柱 ============ */
const P=[
 {id:'p1',n:1,name:'数字で店を分解する',lead:'売上＝客数×客単価×来店頻度。どこを伸ばすかで打ち手が変わります。利益まで見ないと、施策が当たっても儲からないことがあります。',tabs:[['todo','推奨案'],['month','月次'],['week','曜日・天気'],['fl','FL比率'],['data','データ']]},
 {id:'p2',n:2,name:'お客さんを理解する',lead:'会話の中で自然に聞いたことを、タップで残します。客層ごとに来る理由、喜ぶもの、知ったきっかけが見えてきます。',tabs:[['todo','推奨案'],['talk','会話メモ'],['ana','分析']]},
 {id:'p3',n:3,name:'独自の価値を一言にする',lead:'地鶏や焼酎は他の宮崎料理店にもあります。店主の人柄や場の空気のように、真似されにくい価値を言葉にします。',tabs:[['todo','推奨案'],['sheet','ワークシート']]},
 {id:'p4',n:4,name:'集客の入口を整える',lead:'小規模店ではGoogleマップと口コミが最も費用対効果が高い傾向があります。お金をかける前に、無料でできる入口から固めます。',tabs:[['todo','推奨案'],['res','経路の実績']]},
 {id:'p5',n:5,name:'リピートの仕組みを作る',lead:'飲食店の利益は2回目以降の来店で生まれます。名前と好みを覚え、一度来た人とつながり続ける仕組みを作ります。',tabs:[['todo','推奨案'],['tpl','文例'],['kpi','指標']]},
 {id:'p6',n:6,name:'仮説と検証を回す',lead:'施策ごとに「何を・何人・いくら」を先に決め、終わったら数字で振り返ります。日々の記録から効果を自動で計算します。',tabs:[['list','施策'],['todo','推奨案']]},
];
const PM=Object.fromEntries(P.map(p=>[p.id,p]));
const filledMonths=k=>Object.values(S.months).filter(m=>m&&m[k]!=null).length;
const answered=()=>['why','owner','only','win'].filter(k=>(S.value.answers[k]||'').trim()).length;
const T=[

const TM=Object.fromEntries(T.map(t=>[t.id,t]));
const ORDER=['p1-set','p1-daily','p5-regular','p6-first','p2-20','p4-gbp','p4-review','p5-line','p5-ask','p4-photo','p3-sheet','p1-fl','p6-review','p1-weak','p5-sleep','p2-core','p3-cand','p5-card','p4-kenjin','p4-event','p5-msg'];
const isAuto=t=>!!(t.auto&&t.auto());
const isDone=t=>!!S.todo[t.id]||isAuto(t);
const pillarProg=pid=>{const a=T.filter(t=>t.p===pid);return{done:a.filter(isDone).length,all:a.length};};
function nextActions(n){const seq=[...ORDER,...T.map(t=>t.id).filter(id=>!ORDER.includes(id))];return seq.map(id=>TM[id]).filter(t=>!isDone(t)).slice(0,n);}

/* ============ お客様の集計 ============ */
const custTalks=c=>S.talks.filter(t=>t.custId===c.id);
function custVisits(c){return [...new Set([...(c.visits||[]),...custTalks(c).map(t=>t.date)].filter(Boolean))].sort();}
function lastSeen(c){const v=custVisits(c);return v.length?v[v.length-1]:(c.metAt||null);}
const isRegular=c=>(c.ctag||[]).includes('常連')||custVisits(c).length>=3;
const isSleeping=c=>isRegular(c)&&(daysAgo(lastSeen(c))??0)>=60;
const bdayThisMonth=c=>c.bmonth&&+c.bmonth===new Date().getMonth()+1;
const initial=c=>(c.kana||c.name||'？').trim().charAt(0);
const custText=c=>[c.name,c.kana,c.company,c.title,c.feature,c.seg,c.from,c.memo,c.referrer,c.dislikes,...(c.likes||[]),...(c.ctag||[])].join(' ').toLowerCase();
const CF={noname:'名前を入れる',all:'全員',recent:'最近会った',regular:'常連',sleep:'しばらく来ていない',bday:'今月が誕生月',kanji:'幹事・県人会'};
function custFilter(f,c){if(f==='noname')return !!c.needName;if(f==='recent')return (daysAgo(lastSeen(c))??999)<=30;if(f==='regular')return isRegular(c);if(f==='sleep')return isSleeping(c);if(f==='bday')return bdayThisMonth(c);
  if(f==='kanji')return (c.ctag||[]).some(t=>t==='幹事をよくする'||t==='県人会');return true;}

let R=['home'];
function go(path){R=String(path).replace(/^#?\/?/,'').split('/').filter(Boolean);if(!R.length)R=['home'];render();window.scrollTo(0,0);}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(!a)return;e.preventDefault();flushForms();go(a.getAttribute('href').slice(2));});
function render(){
  const app=$('#app');let html='';
  try{
    if(R[0]==='p'&&PM[R[1]])html=vPillar(R[1],R[2],R[3]);
    else if(R[0]==='entry')html=vEntry(R[1],R[2],R[3]);
    else if(R[0]==='cust')html=vCust(R[1],R[2]);
    else if(R[0]==='report')html=vReport();
    else if(R[0]==='help')html=vHelp();
    else if(R[0]==='settings')html=vSettings();
    else if(R[0]==='exp')html=vExpForm(R[1],R[2]);
    else html=vHome();
  }catch(err){html=`<div class="panel" style="margin-top:16px">表示できませんでした：${esc(err.message)}</div>`;console.error(err);}
  app.innerHTML=html;
  const nav=R[0]==='p'?R[1]:R[0]==='exp'?'p6':R[0];
  document.querySelectorAll('nav.bn a').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  after();
}

function expStatus(x){const t=today();if(x.start&&t<x.start)return{k:'plan',l:'準備中'};if(!x.end||t<=x.end)return{k:'run',l:'実施中'};return (x.review||'').trim()?{k:'done',l:'完了'}:{k:'wait',l:'振り返り待ち'};}
function expResult(x){if(!x.start||!x.end)return null;const inP=entries().filter(e=>e.date>=x.start&&e.date<=x.end),from=toDate(x.start);from.setDate(from.getDate()-28);
  const base=entries().filter(e=>e.date>=iso(from)&&e.date<x.start),key=['sales','guests','newGuests'].includes(x.metric)?x.metric:null;let actual=null,expected=null;
  if(key){actual=sum(inP,e=>e[key]);const bw={};base.forEach(e=>{if(e[key]==null)return;const w=toDate(e.date).getDay();(bw[w]=bw[w]||[]).push(e[key]);});let ok=true,ex=0;inP.forEach(e=>{const a=bw[toDate(e.date).getDay()];if(!a){ok=false;return;}ex+=a.reduce((p,c)=>p+c,0)/a.length;});expected=ok&&inP.length?ex:null;}

/* ============ グラフ ============ */
function chartDaily(es){const W=640,H=230,L=44,R2=8,T2=12,B=28,n=es.length;const ma=es.map((_,i)=>{const s=es.slice(Math.max(0,i-6),i+1);return s.length<3?null:sum(s,e=>e.sales)/s.length;});
  const max=Math.max(...es.map(e=>e.sales||0),...ma.filter(v=>v!=null),1)*1.1,pw=(W-L-R2)/n,bw=Math.max(2,pw*.68),y=v=>T2+(H-T2-B)*(1-v/max);let g='';
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R2}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${v>=1e4?Math.round(v/1e4)+'万':Math.round(v)}</text>`;}
  es.forEach((e,i)=>{const x=L+pw*i+(pw-bw)/2,d=toDate(e.date),w=d.getDay(),top=y(e.sales||0);g+=`<rect x="${x}" y="${top}" width="${bw}" height="${H-B-top}" rx="2" fill="${w===5||w===6?'var(--sea)':'var(--sea-soft)'}"><title>${e.date}（${WD[w]}） ${yen(e.sales)}</title></rect>`;if(n<=16||i%Math.ceil(n/12)===0)g+=`<text x="${L+pw*i+pw/2}" y="${H-9}" text-anchor="middle">${d.getDate()}</text>`;});
  const pts=ma.map((v,i)=>v==null?null:`${(L+pw*i+pw/2).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);if(pts.length>1)g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--sun-line)" stroke-width="2.5" stroke-linejoin="round"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="日別の売上グラフ">${g}</svg><div class="legend"><span><i style="background:var(--sea-soft)"></i>日〜木</span><span><i style="background:var(--sea)"></i>金・土</span><span><i style="background:var(--sun-line)"></i>直近7営業日の平均</span></div>`;}
function chartBars(labels,vals,fmt){const W=640,H=200,L=10,R2=10,T2=24,B=26,n=labels.length,mv=Math.max(...vals.map(v=>v||0)),max=Math.max(mv,1)*1.15,pw=(W-L-R2)/n,bw=Math.min(pw*.6,64);let g='';
  labels.forEach((lb,i)=>{const v=vals[i]||0,h=(H-T2-B)*v/max,x=L+pw*i+(pw-bw)/2;g+=`<rect x="${x}" y="${H-B-h}" width="${bw}" height="${h}" rx="5" fill="${v===mv&&v?'var(--sea)':'var(--sea-soft)'}"/>`;if(vals[i]!=null)g+=`<text x="${x+bw/2}" y="${H-B-h-7}" text-anchor="middle">${fmt(vals[i])}</text>`;g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" style="font-size:12px">${lb}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="棒グラフ">${g}</svg>`;}

function filterCustList(){const list=$('#clist');if(!list)return;const terms=custQuery.toLowerCase().split(/[\s　]+/).filter(Boolean);let shown=0;
  list.querySelectorAll('.crow').forEach(r=>{const ok=terms.every(t=>r.dataset.text.includes(t));r.hidden=!ok;if(ok)shown++;});const none=$('#c-none');if(none)none.hidden=shown>0||!terms.length;}
function updatePreview(){const el=$('#b-prev');if(!el)return;const w=[val('b-who'),val('b-what'),val('b-how')].map(s=>s.trim());el.innerHTML=w.some(Boolean)?esc(buildLine(w)):'<span class="muted">ここに一言が表示されます</span>';}
function buildLine(w){let[a,b,c]=w;if(a&&!/[がはの、]$/.test(a))a+='が';if(b&&c)b=b.replace(/[、。]$/,'')+'、';return [a,b,c].filter(Boolean).join('');}
const val=id=>{const e=document.getElementById(id);return e?e.value:'';};
